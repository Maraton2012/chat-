<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный P2P Чат</title>
    <!-- Подключаем библиотеку PeerJS для работы без сервера -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        #messages { height: 250px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 15px; background: #fafafa; border-radius: 8px; }
        .message { margin-bottom: 8px; padding: 6px 10px; border-radius: 6px; background: #e4e6eb; max-width: 80%; }
        .my-message { background: #0084ff; color: white; margin-left: auto; }
        input, button { padding: 12px; margin: 5px 0; box-sizing: border-box; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
        input[type="text"] { width: 100%; }
        button { background: #0084ff; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #006dd9; }
        .id-box { background: #e7f3ff; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>P2P Чат класса</h2>
        <div class="id-box">
            Ваш ID для связи: <span id="my-id" style="font-weight: bold; color: #0084ff;">загрузка...</span>
        </div>
        
        <div>
            <input type="text" id="peer-id-input" placeholder="Введите ID собеседника">
            <button id="connect-btn">Подключиться</button>
        </div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

        <div id="messages"></div>

        <div>
            <input type="text" id="message-input" placeholder="Введите сообщение...">
            <button id="send-btn">Отправить</button>
        </div>
    </div>

    <script>
        const peer = new Peer();
        let conn = null;

        const myIdEl = document.getElementById('my-id');
        const peerIdInput = document.getElementById('peer-id-input');
        const connectBtn = document.getElementById('connect-btn');
        const messagesEl = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // Получаем свой уникальный ID
        peer.on('open', (id) => {
            myIdEl.textContent = id;
        });

        // Слушаем входящие подключения от одноклассников
        peer.on('connection', (connection) => {
            conn = connection;
            appendSystemMessage('Собеседник подключился к вам!');
            setupConnection();
        });

        // Кнопка подключения к другому человеку
        connectBtn.addEventListener('click', () => {
            const id = peerIdInput.value.trim();
            if (!id) return alert('Введите ID!');
            conn = peer.connect(id);
            setupConnection();
            appendSystemMessage('Подключение к ' + id + '...');
        });

        function setupConnection() {
            conn.on('open', () => {
                appendSystemMessage('Соединение установлено! Можете писать.');
            });
            conn.on('data', (data) => {
                appendMessage('Собеседник', data, false);
            });
            conn.on('close', () => {
                appendSystemMessage('Соединение закрыто.');
            });
        }

        // Отправка сообщения
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (!text) return;
            if (!conn || !conn.open) {
                alert('Сначала подключитесь к собеседнику!');
                return;
            }
            conn.send(text);
            appendMessage('Вы', text, true);
            messageInput.value = '';
        });

        function appendMessage(sender, text, isMe) {
            const div = document.createElement('div');
            div.className = 'message' + (isMe ? ' my-message' : '');
            div.textContent = `${sender}: ${text}`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.color = '#888';
            div.style.fontSize = '13px';
            div.style.margin = '5px 0';
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    </script>
</body>
</html>
